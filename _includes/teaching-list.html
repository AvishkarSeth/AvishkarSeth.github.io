{% for c in site.data.teaching %}
<article class="entry">
  <div class="entry-when">
    {% include when.html dates=c.dates %}
  </div>
  <div class="entry-body">
    <h3><a href="{{ c.url }}"{% if c.url contains "://" %} target="_blank" rel="noopener"{% endif %}>{{ c.title | escape }}</a></h3>
    <p class="role">{{ c.role | escape }}</p>
    <p>{{ c.description }}</p>
{% if c.more_url %}    <p><a href="{{ c.more_url }}">Meet the students</a></p>
{% endif %}{% if c.images and c.images.size > 0 %}    <div class="entry-gallery">
{% for img in c.images %}      <img src="/{{ img.src | replace: " ", "%20" }}" alt="{{ img.alt | escape }}" loading="lazy" decoding="async">
{% endfor %}    </div>
{% endif %}  </div>
</article>
{% endfor %}
