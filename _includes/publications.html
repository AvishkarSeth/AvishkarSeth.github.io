{% for group in site.data.publications %}
<!--------------------------------------------------->
<hr><h1><center>{{ group.year }}</center></h1><hr>
<!--------------------------------------------------->

<div class="row">
{% for paper in group.items %}
  <div class="col-lg-4 col-md-6 d-flex align-items-stretch mt-4">
    <div class="icon-box">
      <a href="{{ paper.url }}" target="_blank" rel="noopener">
        <img class="img-fluid" src="{{ paper.image }}" style="padding-bottom: 15px; border-radius: 12px;"{% if paper.alt %} alt="{{ paper.alt | escape }}"{% endif %}>
        <h4>{{ paper.title | escape }}</h4>
        <p style="font-size: 14px; color: #555;">
          <b>{{ paper.kind | escape }}</b><br>
          {{ paper.authors }}<br>
          <i>{{ paper.venue | escape }}</i>{% if paper.note %}<br>
          {{ paper.note }}{% endif %}
        </p>
        <div style="margin-top: 10px; font-weight: bold; color: #007bff;">
          <i class="icofont-globe"></i> View Paper
        </div>
      </a>
    </div>
  </div>
{% endfor %}
</div>

<hr>
{% endfor %}
