{% if site.google_analytics != "" and site.google_analytics %}
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
{% endif %}
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>{{ page.title | default: site.title }}</title>
{% if page.description %}  <meta content="{{ page.description | escape }}" name="description">
{% endif %}
  <!-- Favicons -->
  <link href="/assets/img/favicon_io/favicon-32x32.png" rel="icon" sizes="32x32" type="image/png">
  <link href="/assets/img/favicon_io/favicon-16x16.png" rel="icon" sizes="16x16" type="image/png">
  <link href="/assets/img/favicon_io/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Raleway:300,300i,400,400i,500,500i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/vendor/icofont/icofont.min.css" rel="stylesheet">
  <link href="/assets/vendor/remixicon/remixicon.css" rel="stylesheet">
  <link href="/assets/vendor/owl.carousel/assets/owl.carousel.min.css" rel="stylesheet">
  <link href="/assets/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">
  <link href="/assets/vendor/academicons/css/academicons.min.css" rel="stylesheet">
  <link href="/assets/vendor/venobox/venobox.css" rel="stylesheet">

  <!-- Template Main CSS File -->
  <link href="/assets/css/lighttheme.css" rel="stylesheet">
{% if page.mathjax %}
  <script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
{% endif %}
  <!-- The template shows a section based on the URL hash. Set it here instead of
       reloading the whole page (the old window.onload trick loaded every page twice). -->
  <script>
    if (!location.hash) {
      history.replaceState(null, '', location.pathname + location.search + '#{{ page.section | default: "home" }}');
    }
  </script>
